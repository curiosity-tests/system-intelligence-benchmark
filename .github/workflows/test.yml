name: Run Tests
run-name: "Run Tests ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created, published, edited]
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # If one benchmark fails, continue running the others
      fail-fast: false
      matrix:
        benchmark:
          - example_bench
          - toposense_bench
          - courselab_bench
          - courseexam_bench
          # TODO: For now, we comment out other benchmarks as they have no tests
          # - arteval_bench
          # - cache_bench
          # - course_project_bench

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      working-directory: benchmarks/${{ matrix.benchmark }}
      run: |
        python -m venv env${{ matrix.benchmark }}
        source env${{ matrix.benchmark }}/bin/activate
        pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        if [ -f pyproject.toml ]; then
          pip install -e ".[dev]"
        fi
        deactivate

    - name: Run tests
      run: |
        source benchmarks/${{ matrix.benchmark }}/env${{ matrix.benchmark }}/bin/activate
        pytest benchmarks/${{ matrix.benchmark }}/tests -v
        deactivate
